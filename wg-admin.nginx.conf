# wg-admin TLS front (owner 2026-10-27: nginx terminates TLS, the app listens on 127.0.0.1:8080 only).
# Installed by setup-vpn1.sh as /etc/nginx/sites-available/wg-admin. LAN :8443; the portal proxies /vpn/ here.
# X-Forwarded-For is replaced, never appended: uvicorn trusts it only from 127.0.0.1, and wg-admin's portal SSO
# checks that IP against WGADMIN_TRUSTED_PROXIES.
server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/wg-admin/tls.crt;
    ssl_certificate_key /etc/wg-admin/tls.key;
    # Mozilla "intermediate" profile.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:wgadmin:1m;
    ssl_session_tickets off;

    client_max_body_size 1m;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
